name: build

# Builds the frontend on every pull request, so a dependency bump is known to install and build
# before it merges. Public repository: GitHub's own runner (free); our box refuses public repos.
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","crenya-ci"]') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: getpos-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # vite.config.js reads the bench's sites/common_site_config.json (dev proxy port), as if the app
      # sat in apps/getpos inside a bench: give it one, the build itself never uses the port
      - run: |
          mkdir -p ../../../sites
          echo '{"webserver_port": 8000}' > ../../../sites/common_site_config.json
      - run: corepack enable && yarn install --frozen-lockfile
      - run: yarn build
